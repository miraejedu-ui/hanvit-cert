# Render Blueprint (선택)
# Dashboard에서 수동 생성해도 됩니다.
# Free 플랜에는 Persistent Disk가 없습니다. 데이터 유지가 필요하면 Starter 이상으로 올린 뒤 Disk를 추가하세요.

services:
  - type: web
    name: hanvit-cert
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
